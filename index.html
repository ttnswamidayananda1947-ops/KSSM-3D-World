<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KSSM Hero Adventure</title>

<link rel="stylesheet" href="style.css">

<script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.179.1/build/three.module.js"
  }
}
</script>

</head>
<body>

<!-- Loading Screen -->

<div id="loadingScreen">

    <h1>KSSM HERO ADVENTURE</h1>

    <p>Loading World...</p>

</div>

<!-- HUD -->

<div id="hud">

    <div id="healthBox">
        ❤️ Health :
        <span id="healthText">100</span>
    </div>

    <div id="coinBox">
        🪙 Coins :
        <span id="coinText">0</span>
    </div>

</div>

<!-- Mission Panel -->

<div id="missionPanel">

    <h3>Mission</h3>

    <p>
        Collect Coins And Explore The World
    </p>

</div>

<!-- Mobile Joystick -->

<div id="joystickBase">

    <div id="joystickStick"></div>

</div>

<!-- Buttons -->

<div id="buttonArea">

    <button id="jumpBtn">
        JUMP
    </button>

    <button id="attackBtn">
        HIT
    </button>

</div>

<!-- Game Over -->

<div id="gameOver">

    <h1>GAME OVER</h1>

    <button id="restartBtn">
        Restart
    </button>

</div>

<!-- Script -->

<script type="module" src="script.js"></script>

</body>
</html>
